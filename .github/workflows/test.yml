# Tests
#
# On every push and pull request: luacheck over the code (.luacheckrc says
# what it holds it to), then the tests (tests/run.lua) under plain LuaJIT --
# hex geometry, the rules played without a screen, and whole games of the
# computer playing every side. No LÖVE: the rules never touch it.

name: Tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'shots/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit lua-check
      - name: Lint
        run: luacheck main.lua conf.lua src tests
      - name: Test
        run: luajit tests/run.lua
